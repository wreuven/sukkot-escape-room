<title>צופן הסוכה — חידות חשיבה</title>
<style>
:root{--ink:#253831;--muted:#69786f;--paper:#fffaf0;--green:#1d6244;--gold:#d8ae53;--red:#b64c3b;--shadow:0 16px 46px rgba(45,57,46,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Heebo,Arial,"Noto Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;direction:rtl;background:radial-gradient(circle at 50% -20%,#fffdf7 0,#efe4ca 72%,#e3d4b5 100%);color:var(--ink)}
body{padding:14px;display:flex;justify-content:center}
button{font:inherit}.app{width:min(1120px,100%);display:flex;flex-direction:column;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-family:Rubik,Heebo,Arial,sans-serif}.brandMark{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,#174d36,#2b7952);color:white;display:grid;place-items:center;box-shadow:0 7px 20px rgba(30,96,67,.2)}
.topRight{display:flex;align-items:center;gap:8px}.pill{background:rgba(255,255,255,.78);border:1px solid rgba(34,53,47,.1);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900;white-space:nowrap}.tokens{display:flex;align-items:center;gap:5px}.token{width:18px;height:18px;border-radius:50%;background:var(--gold);border:2px solid #8e7132;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}.token.spent{background:#d8d3c8;border-color:#aaa49a;opacity:.55}
.progress{height:8px;background:rgba(34,53,47,.1);border-radius:99px;overflow:hidden}.progress>i{height:100%;display:block;background:linear-gradient(90deg,#1f6949,#a69443);width:0;transition:.3s}.card{background:rgba(255,250,240,.96);border:2px solid rgba(34,53,47,.08);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.prompt{text-align:center;padding:14px 18px 8px}.kicker{font-size:13px;font-weight:800;color:#6d7b74}.prompt h1{margin:4px 0 0;font-family:Rubik,Heebo,Arial,sans-serif;font-weight:900;font-size:clamp(24px,3vw,34px);line-height:1.2}.prompt p{margin:7px auto 0;max-width:760px;color:var(--muted);font-size:16px;font-weight:600;line-height:1.5}
.sceneWrap{padding:8px 12px 12px}.scene{position:relative;border-radius:19px;overflow:hidden;border:2px solid rgba(34,53,47,.12);background:#d9eceb;aspect-ratio:16/9;width:100%;max-width:calc((100vh - 24px) * 16 / 9);margin:0 auto;touch-action:none;user-select:none}.scene svg{width:100%;height:100%;display:block;touch-action:none}.scene::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 70px rgba(31,53,41,.06);pointer-events:none}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px}.group{display:flex;gap:7px}.btn{border:2px solid rgba(34,53,47,.1);background:white;border-radius:13px;padding:11px 16px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 5px 16px rgba(34,53,47,.07)}.btn.primary{background:var(--green);color:white;border-color:transparent}.btn.hint{background:#f5df95}.btn:disabled{opacity:.38;cursor:not-allowed}.hintRow{min-height:54px;padding:0 12px 12px;display:flex;gap:10px;justify-content:center;align-items:center}.hintText{display:none;background:#fff1ba;border:2px solid #d5ab4d;border-radius:13px;padding:10px 14px;max-width:760px;font-weight:700;font-size:15px;line-height:1.45}.hintText.show{display:block;animation:pop .18s ease}.toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,12px);opacity:0;background:rgba(28,39,34,.91);color:white;padding:9px 14px;border-radius:999px;font-weight:800;font-size:14px;transition:.18s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.correctNote{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:16;width:min(620px,88%);background:rgba(255,253,246,.96);border:3px solid #2c8057;border-radius:20px;padding:17px 22px;box-shadow:0 18px 46px rgba(31,53,41,.22);text-align:center;animation:popCenter .24s cubic-bezier(.2,.9,.2,1.2)}.correctNote strong{display:block;font-size:27px;color:#236844;margin-bottom:5px}.correctNote p{margin:0;color:#4f6258;font-weight:800;line-height:1.35}.correctTick{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin:0 auto 7px;background:#2c8057;color:white;font-size:31px;font-weight:1000}.footer .primary{display:none}.correctNote .noteNext{margin-top:12px;display:inline-flex;align-items:center;gap:8px}.endStats{margin:10px 0 16px;font-weight:800;color:#3f5a4c;font-size:17px}.rotateTip{display:none;text-align:center;font-size:14px;font-weight:700;color:#5b6b62;background:#fff6d6;border:1px solid #e3cf8f;border-radius:12px;padding:8px 10px}@keyframes popCenter{from{opacity:0;transform:translate(-50%,-50%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

.fireworks{position:absolute;inset:0;z-index:14;overflow:hidden;pointer-events:all;background:radial-gradient(circle at 50% 55%,rgba(255,248,218,.16),rgba(17,39,30,.08))}
.fireworkBurst{position:absolute;width:1px;height:1px;animation:burstFlash 1.05s ease-out infinite;animation-delay:var(--delay)}
.fireworkBurst::after{content:"";position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff6c8;box-shadow:0 0 18px 7px rgba(255,235,151,.6);animation:coreFlash 1.05s ease-out infinite;animation-delay:var(--delay)}
.fireworkSpark{position:absolute;left:-2px;top:-2px;width:4px;height:38px;border-radius:999px;background:linear-gradient(to bottom,var(--spark),rgba(255,255,255,0));transform-origin:2px 2px;transform:rotate(var(--angle)) translateY(-4px) scaleY(.08);opacity:0;animation:fireSpark 1.05s ease-out infinite;animation-delay:var(--delay);filter:drop-shadow(0 0 3px var(--spark))}
@keyframes fireSpark{0%{opacity:0;transform:rotate(var(--angle)) translateY(-3px) scaleY(.05)}12%{opacity:1}65%{opacity:.88;transform:rotate(var(--angle)) translateY(-58px) scaleY(1)}100%{opacity:0;transform:rotate(var(--angle)) translateY(-82px) scaleY(.5)}}
@keyframes coreFlash{0%,8%{opacity:0;transform:scale(.2)}14%{opacity:1;transform:scale(1.2)}55%,100%{opacity:0;transform:scale(.3)}}
@keyframes burstFlash{0%,100%{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@media(max-width:760px){body{padding:7px}.brand span{display:none}.prompt{padding:11px 10px 7px}.prompt h1{font-size:23px}.prompt p{font-size:15px}.pill{font-size:12px;padding:7px 10px}.btn{padding:10px 12px}}
@media(max-width:760px) and (orientation:portrait){.rotateTip{display:block}}

<body>

  <div class="top"><div class="brand"><div class="brandMark"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 19c0-8 5-14 14-15-1 9-7 14-15 14" fill="#bfe3c8"/><path d="M5 19c3-4 6-7 10-9" stroke="#174d36" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div><span>צופן הסוכה — חידות חשיבה</span></div><div class="topRight"><div class="pill tokens" id="tokens" title="רמזים שנותרו" aria-label="רמזים שנותרו"></div><div class="pill" id="count">חידה 1 מתוך 6</div></div></div>
