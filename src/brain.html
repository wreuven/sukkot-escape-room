*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Heebo,Arial,"Noto Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;direction:rtl;background:radial-gradient(circle at 50% -20%,#fffdf7 0,#efe4ca 72%,#e3d4b5 100%);color:var(--ink)}
body{padding:14px;display:flex;justify-content:center}
button{font:inherit}.app{width:min(1120px,100%);display:flex;flex-direction:column;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-family:Rubik,Heebo,Arial,sans-serif}.brandMark{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,#174d36,#2b7952);color:white;display:grid;place-items:center;box-shadow:0 7px 20px rgba(30,96,67,.2)}

.fireworkBurst{position:absolute;width:1px;height:1px;animation:burstFlash 1.05s ease-out infinite;animation-delay:var(--delay)}

@keyframes coreFlash{0%,8%{opacity:0;transform:scale(.2)}14%{opacity:1;transform:scale(1.2)}55%,100%{opacity:0;transform:scale(.3)}}

    if(successAudioCtx.state==='suspended')successAudioCtx.resume();
    const now=successAudioCtx.currentTime;
    const notes=[{f:523.25,t:0,d:.20},{f:659.25,t:.18,d:.22},{f:783.99,t:.38,d:.24},{f:1046.5,t:.62,d:.34}];

  rect(hat,436,190,128,78,'#2b2f33',{rx:8,stroke:'#15181a','stroke-width':4});rect(hat,436,242,128,16,'#b64c3b');
  S('ellipse',{cx:500,cy:266,rx:100,ry:16,fill:'#2b2f33',stroke:'#15181a','stroke-width':4},hat);
  draggableItem(hat,500,228,()=>toast('הכובע טפל לגופו ואינו חוצץ בינו לבין הסכך — הוא לא הבעיה.'));
  draggableItem(man,500,320,()=>toast('הוא יושב בדיוק במקום הנכון.'));

  // Three extra layers of the same schach slats piled on top (alternate layers offset half a slat, so together they close every gap)
  const SLOTS=17,layers=[];
  for(let i=0;i<3;i++){
    const lift=7+i*8,off=i%2?0.5:0;
    const lg={...geo,roof:{fl:{x:R.fl.x,y:R.fl.y-lift},fr:{x:R.fr.x,y:R.fr.y-lift},bl:{x:R.bl.x,y:R.bl.y-lift},br:{x:R.br.x,y:R.br.y-lift}}};
    const gr=g(svg,{filter:'url(#tinyShadow)'});
    for(let j=0;j<SLOTS-(off?1:0);j++)drawRoofSlat(gr,lg,j+off,SLOTS);
    layers.push(gr);
  }
  // Shade meter
  const meter=g(svg,{'pointer-events':'none'});const mBox=rect(meter,640,18,340,70,'#fffaf0',{rx:14,stroke:'#b64c3b','stroke-width':4});
  const mTitle=text(meter,810,48,'',22,{'font-weight':900,'text-anchor':'middle',fill:'#b64c3b'});
  const mSub=text(meter,810,74,'',14,{'font-weight':700,'text-anchor':'middle',fill:'#5a6a62'});
  let extra=3;
  function updateMeter(){
    const st=[['צל: 70%','צילתה מרובה מחמתה','#28734e'],['צל: 90%','רואים נצנוצי שמש דרך הסכך','#28734e'],['צל: 100%','אטום — אף קרן שמש אינה חודרת','#b0761f'],['צל: 100%','אטום — גם גשם לא יחדור','#b64c3b']][extra];
    mTitle.textContent=st[0];mSub.textContent=st[1];mTitle.setAttribute('fill',st[2]);mBox.setAttribute('stroke',st[2]);
    rays.setAttribute('opacity',extra<=1?1:0);
  }
  updateMeter();
  layers.forEach(layer=>{
    let dx=0,dy=0;
    drag(layer,{move:(e,a,b)=>{dx=a;dy=b;layer.setAttribute('transform',`translate(${a} ${b})`)},end:()=>{
      if(Math.hypot(dx,dy)>70){
        layer.animate([{transform:`translate(${dx}px,${dy}px)`,opacity:1},{transform:`translate(${dx*1.5}px,${dy*1.5+30}px)`,opacity:0}],{duration:450,easing:'ease-in'}).onfinish=()=>layer.remove();
        extra--;updateMeter();
        if(extra<=1)setTimeout(()=>success('הסכך היה עבה כל כך שאפילו גשם לא היה חודר דרכו — יש אומרים שסוכה כזו פסולה, כי היא אטומה כדירת קבע. ולכתחילה צריך שייראו דרך הסכך כוכבים, או לפחות נצנוצי שמש. הסרתם את העודף, והצל עדיין מרובה מהחמה. הכובע הגדול טפל לגוף ואינו חוצץ.'),500);
        else toast('עדיין אטום לגמרי — אף קרן שמש לא עוברת.');
      }else{
        layer.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:250,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>layer.removeAttribute('transform');
        toast('משכו את השכבה החוצה, אל מחוץ לגג.');
      }
    }});
  });
}

// PUZZLE 3 — first day: the species must be Jacob's own. Drag the word "מתנה" onto Avi's label.
function b3(){
  const svg=baseSvg();landscape(svg);groundBand(svg,440);
  rect(svg,330,352,270,14,'#94633b',{rx:6,stroke:'#40372f','stroke-width':4});S('path',{d:'M350 366v72M580 366v72',stroke:'#7b5335','stroke-width':9},svg);
  // Avi (left) and Jacob (right)
  standingPerson(svg,150,232,'#7a6649');nameTag(svg,150,196,'אבי');
  const jacob=standingPerson(svg,790,232,'#426c86',false);nameTag(svg,790,196,'יעקב');
  // The four species on the table, with an ownership label
  const set=g(svg,{filter:'url(#soft)'});
  drawArbaMinim(set,{x:448,base:352,tip:150,sideTop:208,holderTop:296,holderBottom:306,s:1});use(set,'etrogReal',514,296,56,62);
  const tag=g(svg);S('line',{x1:448,y1:250,x2:392,y2:272,stroke:'#8a6b3c','stroke-width':2},tag);
  const tagBg=rect(tag,262,256,132,40,'#fffaf0',{rx:8,stroke:'#7a765f','stroke-width':2.5});
  const tagText=text(tag,328,282,'שייך לאבי',16,{'font-weight':800,'text-anchor':'middle',fill:'#893c2e'});
  // An unrelated present with a gift tag
  const box=g(svg,{filter:'url(#tinyShadow)'});rect(box,880,372,90,66,'#d65c52',{rx:6,stroke:'#6b2a22','stroke-width':3});
  rect(box,918,372,14,66,'#e7bd4f');rect(box,880,398,90,12,'#e7bd4f');S('path',{d:'M925 372 q-24 -26 -34 -4 q14 10 34 4 q24 -26 34 -4 q-14 10 -34 4',fill:'#e7bd4f',stroke:'#8a6b1f','stroke-width':2},box);
  S('line',{x1:925,y1:372,x2:905,y2:346,stroke:'#8a6b3c','stroke-width':2},svg);
  const giftWord=g(svg);rect(giftWord,862,322,76,32,'#fffaf0',{rx:8,stroke:'#7a765f','stroke-width':2});text(giftWord,900,344,'מתנה',16,{'font-weight':800,'text-anchor':'middle'});
  // Decoys: coins and scissors
  const coins=g(svg);[0,1,2].forEach(i=>S('ellipse',{cx:250,cy:430-i*7,rx:18,ry:7,fill:'#e7bd4f',stroke:'#8a6b1f','stroke-width':2.5},coins));
  const scis=g(svg);TOOLS.scissors(scis,610,330);

  const jacobBox={x:720,y:190,w:150,h:240},aviBox={x:90,y:190,w:130,h:240},tagBox={x:250,y:236,w:320,h:130};
  let gifted=false;
  draggableItem(set,470,270,(pt)=>{if(!gifted&&inBox(pt,jacobBox))toast('ביום הראשון צריך "לכם" — משלכם. בארבעת מינים שאולים יעקב אינו יוצא ידי חובה.')});
  draggableItem(tag,328,276,()=>toast('התווית אומרת את האמת — ארבעת המינים באמת של אבי.'));
  draggableItem(coins,250,420,(pt)=>{if(inBox(pt,aviBox))toast('אבי אינו מוכר את ארבעת המינים שלו — הוא צריך אותם בעצמו.')});
  draggableItem(scis,610,330,()=>toast('לחתוך? חס וחלילה!'));
  draggableItem(giftWord,900,338,(pt)=>{
    if(!inBox(pt,tagBox))return;
    gifted=true;giftWord.remove();
    tagBg.setAttribute('x',212);tagBg.setAttribute('width',232);tagText.setAttribute('x',328);tagText.setAttribute('fill','#236844');
    tagText.textContent='מתנה ליעקב על מנת להחזיר';
    set.animate([{transform:'translate(0,0)'},{transform:'translate(260px,-20px)'}],{duration:900,easing:'cubic-bezier(.3,.7,.3,1)',fill:'forwards'});
    setTimeout(()=>success('ביום הראשון צריך ש"לכם" — שארבעת המינים יהיו שלו, ובמינים שאולים אינו יוצא. אבי נתן ליעקב את ארבעת המינים במתנה על מנת להחזיר, ולכן יעקב יכול לקיים בהם את המצווה, ואחר כך יחזיר אותם.'),1000);
    return 'keep';
  });
}

const renderers=[b1,b2,b3];
function render(){solved=false;next.disabled=true;prev.disabled=level===0;reset.disabled=false;hintText.classList.remove('show');updateUI();renderers[level]();progress.style.width=(level/N*100)+'%'}
prev.onclick=()=>{if(level>0&&!solved){level--;render()}};reset.onclick=()=>{if(!solved)render()};next.onclick=()=>{};
render();
})();
</script>
